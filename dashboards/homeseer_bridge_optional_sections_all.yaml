# ---- homeseer_bridge_auto_area_prep_sections.yaml ----
# Optional v3.1.0 Auto Area Prep section.
# Safe preview only: this does not create or change Home Assistant Areas/Floors.

- type: grid
  cards:
    - type: heading
      heading: Auto Area Prep
    - type: entities
      title: Proposed Area/Floor Mapping
      entities:
        - entity: sensor.homeseer_bridge_proposed_areas
          name: Proposed Areas
        - entity: sensor.homeseer_bridge_proposed_floors
          name: Proposed Floors
        - entity: sensor.homeseer_bridge_proposed_rooms
          name: Proposed Rooms
        - entity: sensor.homeseer_bridge_largest_proposed_area_devices
          name: Largest Area Device Count
        - entity: sensor.homeseer_bridge_largest_proposed_floor_devices
          name: Largest Floor Device Count
    - type: markdown
      title: Mapping Details
      content: >-
        Open Developer Tools → States and select one of the Auto Area Prep
        sensors to view the `area_floor_summary` attribute with top proposed
        areas, floors, rooms, and sample mappings.

# ---- homeseer_bridge_activity_filter_sections.yaml ----
# Optional v3.3.0 Activity Filter section.
# Configure filtered terms in the integration Options screen.

- type: grid
  cards:
    - type: heading
      heading: Activity Filtering
    - type: entities
      title: Recent Activity Filter
      entities:
        - entity: sensor.homeseer_bridge_recent_activity
          name: Latest Visible Activity
        - entity: sensor.homeseer_bridge_recent_activity_count
          name: Visible Events
        - entity: sensor.homeseer_bridge_recent_activity_filtered_count
          name: Filtered Events
    - type: markdown
      title: How filtering works
      content: >-
        Activity filtering is controlled from Settings → Devices & services →
        HomeSeer Bridge → Configure.

        Add comma-separated terms such as `utility,jon00`.

        Matching activity is hidden from the Live Event Viewer but still leaves a
        filtered count for troubleshooting.

# ---- homeseer_bridge_device_explorer_prep_sections.yaml ----
# Optional v3.4.0 Device Explorer Prep section.

- type: grid
  cards:
    - type: heading
      heading: Device Explorer Prep
    - type: entities
      title: Activity Leaders
      entities:
        - entity: sensor.homeseer_bridge_explorer_tracked_refs
          name: Refs With Visible Activity
        - entity: sensor.homeseer_bridge_explorer_filtered_refs
          name: Refs With Filtered Activity
        - entity: sensor.homeseer_bridge_explorer_top_active_count
          name: Busiest Visible Ref Count
        - entity: sensor.homeseer_bridge_explorer_top_filtered_count
          name: Noisiest Filtered Ref Count
    - type: markdown
      title: Explorer Details
      content: >-
        Open Developer Tools → States and select one of the Explorer sensors.

        The `device_explorer` attribute includes:

        - top active refs
        - top filtered refs
        - recently changed refs
        - names, locations, status, category, and confidence
