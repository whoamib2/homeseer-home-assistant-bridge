# Optional v3.5.0 Repairs Prep section.
# This exposes repair candidates only. It does not create native HA Repairs yet.

- type: grid
  cards:
    - type: heading
      heading: Repairs Prep
    - type: entities
      title: Repair Candidates
      entities:
        - entity: sensor.homeseer_bridge_repairs_health_score
          name: Repairs Health Score
        - entity: sensor.homeseer_bridge_repair_candidates
          name: Total Candidates
        - entity: sensor.homeseer_bridge_critical_repairs
          name: Critical
        - entity: sensor.homeseer_bridge_repair_warnings
          name: Warnings
        - entity: sensor.homeseer_bridge_repair_info
          name: Info
    - type: markdown
      title: Repair Details
      content: >-
        Open Developer Tools → States and select one of the Repairs sensors.

        The `repairs_report` attribute contains structured repair candidates,
        including critical issues, warnings, and informational cleanup items.
