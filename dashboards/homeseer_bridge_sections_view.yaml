type: sections
title: HomeSeer Bridge
path: homeseer-bridge
icon: mdi:home-automation
sections:
  - type: grid
    cards:
      - type: heading
        heading: HomeSeer Bridge Health
      - type: tile
        entity: binary_sensor.homeseer_bridge_connected
        name: Bridge Connected
        icon: mdi:connection
      - type: tile
        entity: binary_sensor.homeseer_bridge_api_healthy
        name: API Healthy
        icon: mdi:api
      - type: gauge
        entity: sensor.homeseer_bridge_health_score
        name: Health Score
        min: 0
        max: 100
        severity:
          green: 90
          yellow: 60
          red: 0
      - type: entities
        title: Health Details
        entities:
          - entity: sensor.homeseer_bridge_api_latency
            name: API Latency
          - entity: sensor.homeseer_bridge_last_mqtt_age
            name: Last MQTT Age
          - entity: sensor.homeseer_bridge_unmatched_topics
            name: Unmatched Topics

  - type: grid
    cards:
      - type: heading
        heading: Device Counts
      - type: tile
        entity: sensor.homeseer_bridge_devices
        name: Devices
        icon: mdi:devices
      - type: tile
        entity: sensor.homeseer_bridge_virtual_devices
        name: Virtual Devices
        icon: mdi:toggle-switch
      - type: entities
        title: Counts
        entities:
          - entity: sensor.homeseer_bridge_devices
            name: Devices
          - entity: sensor.homeseer_bridge_virtual_devices
            name: Virtual Devices
          - entity: sensor.homeseer_bridge_unmatched_topics
            name: Unmatched Topics

  - type: grid
    cards:
      - type: heading
        heading: Activity
      - type: entities
        title: Bridge Activity
        entities:
          - entity: sensor.homeseer_bridge_mqtt_updates
            name: MQTT Updates
          - entity: sensor.homeseer_bridge_api_refreshes
            name: API Refreshes
          - entity: sensor.homeseer_bridge_virtual_polls
            name: Virtual Polls
          - entity: sensor.homeseer_bridge_last_refresh_changes
            name: Last Refresh Changes
          - entity: sensor.homeseer_bridge_new_devices_seen
            name: New Devices Seen
      - type: history-graph
        title: API Latency
        hours_to_show: 24
        entities:
          - sensor.homeseer_bridge_api_latency
      - type: history-graph
        title: Health Score
        hours_to_show: 24
        entities:
          - sensor.homeseer_bridge_health_score

- type: grid
  cards:
    - type: heading
      heading: Live HomeSeer Status
    - type: entities
      title: Overall State
      entities:
        - entity: sensor.homeseer_bridge_devices_on
          name: Devices On
        - entity: sensor.homeseer_bridge_devices_off
          name: Devices Off
        - entity: sensor.homeseer_bridge_devices_unknown
          name: Unknown State
        - entity: sensor.homeseer_bridge_low_battery_devices
          name: Low Battery Devices
    - type: entities
      title: Lights and Switches
      entities:
        - entity: sensor.homeseer_bridge_lights_on
          name: Lights On
        - entity: sensor.homeseer_bridge_lights_off
          name: Lights Off
        - entity: sensor.homeseer_bridge_switches_on
          name: Switches On
        - entity: sensor.homeseer_bridge_switches_off
          name: Switches Off
    - type: entities
      title: Doors, Locks, Fans, Climate
      entities:
        - entity: sensor.homeseer_bridge_binary_sensors_on
          name: Binary Sensors On
        - entity: sensor.homeseer_bridge_covers_open
          name: Covers Open
        - entity: sensor.homeseer_bridge_locks_unlocked
          name: Locks Unlocked
        - entity: sensor.homeseer_bridge_fans_on
          name: Fans On
        - entity: sensor.homeseer_bridge_climate_active
          name: Climate Active

- type: grid
  cards:
    - type: heading
      heading: Performance Rates
    - type: entities
      title: Throughput
      entities:
        - entity: sensor.homeseer_bridge_mqtt_updates_per_minute
          name: MQTT Updates / Minute
        - entity: sensor.homeseer_bridge_api_refreshes_per_hour
          name: API Refreshes / Hour
        - entity: sensor.homeseer_bridge_virtual_polls_per_minute
          name: Virtual Polls / Minute
        - entity: sensor.homeseer_bridge_uptime
          name: Bridge Uptime
    - type: history-graph
      title: MQTT Updates
      hours_to_show: 24
      entities:
        - sensor.homeseer_bridge_mqtt_updates
    - type: history-graph
      title: Virtual Polls
      hours_to_show: 24
      entities:
        - sensor.homeseer_bridge_virtual_polls
